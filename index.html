<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 표정 한마디</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff8fb1;--pink-d:#f0689a;--ink:#5b4a54}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;min-height:100dvh;padding:18px 14px 28px;
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#ffe1ec 0%,#fff3e3 45%,#dcf6e2 100%);
  background-attachment:fixed;
  display:flex;align-items:center;justify-content:center;overflow-x:hidden;
}
.deco{position:fixed;pointer-events:none;user-select:none;opacity:.9;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}
.card{
  position:relative;z-index:1;width:100%;max-width:440px;padding:26px 20px 28px;text-align:center;
  background:rgba(255,255,255,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:3px solid #fff;border-radius:34px;box-shadow:0 14px 40px rgba(240,104,154,.22);
}
.sticker{position:absolute;font-size:44px;pointer-events:none}
.s1{top:-20px;left:-10px;transform:rotate(-18deg)}
.s2{top:-18px;right:-8px;transform:rotate(14deg)}
.s3{bottom:-18px;right:-6px;transform:rotate(10deg)}

/* 시작 화면 */
.mascot{font-size:84px;line-height:1;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-size:32px;margin:10px 0 8px;color:var(--pink-d);font-weight:400}
.sub{font-size:17px;line-height:1.5;margin:0 0 18px;opacity:.85}
.faces{font-size:30px;letter-spacing:6px;margin-bottom:24px}

/* 버튼 */
.btn{
  font-family:inherit;font-size:23px;color:#fff;border:0;border-radius:999px;padding:14px 42px;cursor:pointer;
  background:linear-gradient(135deg,#ff9ebd,#ff7aa5);
  box-shadow:0 6px 0 #e85d90,0 12px 22px rgba(240,104,154,.3);
  transition:transform .1s,box-shadow .1s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #e85d90}
.btn.mint{background:linear-gradient(135deg,#9fe3b4,#6fd08f);box-shadow:0 6px 0 #4db873,0 12px 22px rgba(77,184,115,.3)}
.btn.mint:active{box-shadow:0 2px 0 #4db873}

/* 카메라 */
.cam{
  position:relative;aspect-ratio:1/1;border-radius:30px;overflow:hidden;background:#ffe9f1;
  border:5px solid #fff;box-shadow:0 0 0 4px #ffc2d8,0 10px 26px rgba(240,104,154,.25);
}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
#loading{background:rgba(255,240,246,.88);font-size:20px}
#loading .spin{font-size:56px;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{margin:10px 0 0}
body[data-s="loading"] #loading{display:flex}
#count{font-size:170px;line-height:1;color:#fff;-webkit-text-stroke:10px #ff7aa5;paint-order:stroke fill;text-shadow:0 8px 0 rgba(240,104,154,.35)}
body[data-s="count"] #count{display:flex}
@keyframes pop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
#hint{
  position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:none;white-space:nowrap;
  background:rgba(255,255,255,.92);padding:8px 18px;border-radius:999px;font-size:17px;color:var(--pink-d);
}
#bar{position:absolute;left:0;bottom:0;height:9px;width:0;background:linear-gradient(90deg,#ffb3cc,#ff7aa5);display:none}
body[data-s="capture"] #hint,body[data-s="capture"] #bar{display:block}

/* 결과 */
#result{display:none;margin-top:16px}
body[data-s="done"] #result,body[data-s="error"] #result{display:block}
#result.in{animation:rise .5s ease both}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
#emo{font-size:64px;line-height:1}
#ename{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:999px;background:#ffe3ee;color:var(--pink-d);font-size:16px}
#msg{
  margin:12px 0 0;padding:16px 18px;background:#fff;border-radius:24px;border:2px dashed #ffc2d8;
  font-size:20px;line-height:1.6;word-break:keep-all;box-shadow:0 6px 18px rgba(240,104,154,.12);
}
#chip{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:999px;background:#e6f8ec;font-size:15px}
#tip{margin-top:8px;font-size:16px;color:#3f9a62}
#retryBtn{display:none;margin-top:18px}
body[data-s="done"] #retryBtn,body[data-s="error"] #retryBtn{display:inline-block}

/* 화면 전환 */
body[data-s="start"] #main{display:none}
body:not([data-s="start"]) #start{display:none}
#info{position:fixed;left:0;right:0;bottom:4px;z-index:2;margin:0;font-size:11px;color:#9a8a93;text-align:center}
@media (prefers-reduced-motion:reduce){.deco,.mascot,#loading .spin{animation:none}}
</style>
</head>
<body data-s="start">

<span class="deco" style="top:5%;left:7%;font-size:40px">🍀</span>
<span class="deco" style="top:11%;right:9%;font-size:34px;animation-delay:-1s">🌸</span>
<span class="deco" style="top:30%;left:3%;font-size:26px;animation-delay:-2s">⭐</span>
<span class="deco" style="top:40%;right:4%;font-size:30px;animation-delay:-3s">💗</span>
<span class="deco" style="top:62%;left:5%;font-size:44px;animation-delay:-4s">☁️</span>
<span class="deco" style="bottom:7%;right:8%;font-size:40px;animation-delay:-1.5s">🍀</span>
<span class="deco" style="bottom:13%;left:11%;font-size:32px;animation-delay:-2.5s">🌷</span>
<span class="deco" style="top:21%;right:30%;font-size:24px;animation-delay:-3.5s">✨</span>
<span class="deco" style="top:50%;left:2%;font-size:28px;animation-delay:-5s">🍃</span>
<span class="deco" style="bottom:28%;right:2%;font-size:34px;animation-delay:-0.5s">🐥</span>

<main class="card">
  <span class="sticker s1">🍀</span>
  <span class="sticker s2">🌸</span>
  <span class="sticker s3">⭐</span>

  <section id="start">
    <div class="mascot">🍀</div>
    <h1>오늘의 표정 한마디</h1>
    <p class="sub">표정과 날씨를 읽고<br>나에게 딱 맞는 한마디를 건네줄게요</p>
    <div class="faces">😊 😆 😲 😐</div>
    <button id="startBtn" class="btn">시작하기</button>
  </section>

  <section id="main">
    <div class="cam">
      <video id="v" autoplay playsinline muted></video>
      <div id="loading" class="overlay"><div class="spin">🍀</div><p>준비 중이에요</p></div>
      <div id="hint">지금 표정을 보여줘요!</div>
      <div id="bar"></div>
    </div>

    <div id="result">
      <div id="emo"></div>
      <div id="ename"></div>
      <p id="msg"></p>
      <div id="chip"></div>
      <div id="tip"></div>
    </div>

    <button id="retryBtn" class="btn mint">다시하기</button>
  </section>
</main>
<p id="info"></p>

  "☕ 쌀쌀한 날엔 따뜻한 음료가 최고예요, 몸을 따뜻하게 해요!",
  "🧥 오늘은 두꺼운 겉옷이 필수예요, 감기 조심해요!"
];
const TIPS_HOT = [
  "💧 오늘 꽤 더워요, 물 자주 마셔요!",
  "🧢 더운 날이에요, 햇빛 아래에서는 모자나 그늘을 챙겨요!",
  "🍉 더위에 지치지 않게 시원한 물이나 과일을 챙겨 먹어요!",
  "😎 오늘 많이 더워요, 무리하지 말고 중간중간 쉬어가요!"
];
const randOf = (arr) => arr[Math.floor(Math.random() * arr.length)];

const EMOJI = {happy:"🙂", laugh:"😆", sad:"😢", angry:"😠", surprised:"😲", neutral:"😐"};
const NAME  = {happy:"웃음", laugh:"활짝 웃음", sad:"슬픔", angry:"화남", surprised:"놀람", neutral:"무표정"};

/* ---------- 요소 ---------- */
const $ = (id) => document.getElementById(id);
const video = $("v"), emoEl = $("emo"), nameEl = $("ename"),
      msgEl = $("msg"), chipEl = $("chip"), tipEl = $("tip"), barEl = $("bar"),
      infoEl = $("info"), startBtn = $("startBtn"), retryBtn = $("retryBtn"), resultEl = $("result");
const DEBUG = location.search.includes("debug");

let landmarker = null;
let wx = null;
const lastIdx = {};

function setState(s){ document.body.dataset.s = s; }

/* ---------- 날씨 ---------- */
function weatherInfo(code){
  if(code === 0) return {kind:"clear", icon:"☀️", label:"맑음"};
  if(code === 1) return {kind:"clear", icon:"🌤️", label:"대체로 맑음"};
  if(code === 2) return {kind:"cloudy", icon:"⛅", label:"구름 조금"};
  if(code === 3) return {kind:"cloudy", icon:"☁️", label:"흐림"};
  if(code === 45 || code === 48) return {kind:"cloudy", icon:"🌫️", label:"안개"};
  if(code >= 51 && code <= 57) return {kind:"rain", icon:"🌦️", label:"이슬비"};
  if(code >= 61 && code <= 67) return {kind:"rain", icon:"🌧️", label:"비"};
  if(code >= 71 && code <= 77) return {kind:"snow", icon:"❄️", label:"눈"};
  if(code >= 80 && code <= 82) return {kind:"rain", icon:"🌦️", label:"소나기"};
  if(code === 85 || code === 86) return {kind:"snow", icon:"🌨️", label:"눈"};
  if(code >= 95) return {kind:"rain", icon:"⛈️", label:"천둥번개"};
  return {kind:"cloudy", icon:"☁️", label:"흐림"};
}

let wxError = "";   // 날씨를 못 가져온 이유 (결과 화면에 표시)

function getPosition(){
  return new Promise((resolve) => {
    if(!navigator.geolocation){ resolve({err:"unavailable"}); return; }
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({lat:p.coords.latitude, lon:p.coords.longitude}),
      (e) => { console.warn("위치 실패", e); resolve({err: e.code === 1 ? "denied" : (e.code === 3 ? "timeout" : "unavailable")}); },
      {timeout: 10000, maximumAge: 600000}
    );
  });
}

/* 기기에서 위치를 못 찾을 때(주로 PC)만 대략적인 위치(IP 기준)로 대신함 */
async function ipPosition(){
  try{
    const j = await fetch("https://ipwho.is/").then((r) => r.json());
    if(j && j.success !== false && j.latitude != null) return {lat:j.latitude, lon:j.longitude};
  } catch(e){
    console.warn("IP 위치 실패", e);
  }
  return null;
}

async function fetchWeather(){
  wxError = "";
  let pos = await getPosition();
  if(pos.err){
    if(pos.err === "denied"){ wxError = "위치 권한이 꺼져 있어요"; return null; }
    pos = await ipPosition();
    if(!pos){ wxError = "위치를 찾지 못했어요"; return null; }
  }
  const lat = pos.lat.toFixed(2), lon = pos.lon.toFixed(2);   // 대략적인 위치만 사용
  try{
    const wReq = fetch("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&current=temperature_2m,weather_code&timezone=auto").then((r) => r.json());
    const gReq = fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + lat +
      "&longitude=" + lon + "&localityLanguage=ko").then((r) => r.json()).catch(() => null);
    const [w, g] = await Promise.all([wReq, gReq]);
    const info = weatherInfo(w.current.weather_code);
    let name = null;
    if(g){
      const a = g.city || g.principalSubdivision || "";
      const b = g.locality || "";
      name = (b && b !== a) ? (a + " " + b).trim() : a;
    }
    return {name: name || null, temp: w.current.temperature_2m, kind: info.kind, icon: info.icon, label: info.label};
  } catch(e){
    console.warn("날씨 실패", e);
    wxError = "날씨 정보를 불러오지 못했어요";
    return null;
  }
}

/* ---------- 얼굴 읽기 ---------- */
function readFace(){
  if(video.readyState < 2) return null;
  const r = landmarker.detectForVideo(video, performance.now());
  if(r.faceBlendshapes && r.faceBlendshapes.length){
    const s = {};
    r.faceBlendshapes[0].categories.forEach((c) => { s[c.categoryName] = c.score; });
    return s;
  }
  return null;
}

function classify(s){
  const d = (n) => s[n] || 0;   // 기준 보정 없이 얼굴 수치(0~1)를 그대로 사용
  const smile = (d("mouthSmileLeft") + d("mouthSmileRight")) / 2;
  const frown = (d("mouthFrownLeft") + d("mouthFrownRight")) / 2;
  const brow = (d("browDownLeft") + d("browDownRight")) / 2;
  const wide = (d("eyeWideLeft") + d("eyeWideRight")) / 2;
  const jaw = d("jawOpen");
  const up = d("browInnerUp");
  if(DEBUG){
    infoEl.textContent = "웃음 " + smile.toFixed(2) + " | 입꼬리내림 " + frown.toFixed(2) + " | 찡그림 " + brow.toFixed(2) +
      " | 입벌림 " + jaw.toFixed(2) + " | 눈썹올림 " + up.toFixed(2) + " | 눈크게 " + wide.toFixed(2);
  }
  if(smile > 0.65 || (smile > 0.5 && jaw > 0.3)) return "laugh";
  if(smile > 0.4) return "happy";
  if(jaw > 0.4) return "surprised";                  // 입이 크게 벌어지면 놀람
  // 슬픔·화남은 얼굴 변화가 작고 사람마다 달라서 인식하지 않음 (나머지는 무표정)
  return "neutral";
}

/* 측정 시간 동안 가장 많이 나온 표정을 고름 (순간적인 오판 방지) */
function decide(votes, total){
  let best = null, bc = 0;
  ["laugh","happy","surprised","angry","sad"].forEach((k) => {
    if(votes[k] > bc){ bc = votes[k]; best = k; }
  });
  if(best && bc >= total * 0.3) return best;
  return "neutral";
}

/* ---------- 결과 표시 ---------- */
function pickFrom(key, arr){
  let i;
  do { i = Math.floor(Math.random() * arr.length); } while(arr.length > 1 && i === lastIdx[key]);
  lastIdx[key] = i;
  return arr[i];
}

function showResult(e){
  if(e === "fail"){
    emoEl.textContent = "🔍";
    nameEl.style.display = "none";
    msgEl.textContent = "얼굴이 잘 보이지 않았어요. 밝은 곳에서 얼굴을 화면 가운데에 맞추고 다시 해볼까요?";
    chipEl.style.display = "none";
    tipEl.textContent = "";
  } else {
    const kind = wx ? wx.kind : null;
    /* 날씨 문구 + 공통 문구를 한데 섞어서 그중에서 무작위로 고름 */
    const pool = (kind && PHRASES[e][kind]) ? PHRASES[e][kind].concat(GENERIC[e]) : GENERIC[e];
    emoEl.textContent = EMOJI[e];
    nameEl.textContent = NAME[e];
    nameEl.style.display = "inline-block";
    msgEl.textContent = pickFrom(e + (kind || ""), pool);
    chipEl.style.display = "inline-block";
    if(wx){
      chipEl.textContent = "📍 " + (wx.name ? wx.name + " · " : "") + wx.icon + " " + wx.label + " · " + Math.round(wx.temp) + "°C";
      if(wx.temp <= 3) tipEl.textContent = randOf(TIPS_COLD);
      else if(wx.temp >= 28) tipEl.textContent = randOf(TIPS_HOT);
      else tipEl.textContent = "";
    } else {
      chipEl.textContent = "🌥️ " + (wxError || "위치를 허용하면 날씨도 함께 반영돼요");
      tipEl.textContent = "";
    }
  }
  setState("done");
  resultEl.classList.remove("in");
  void resultEl.offsetWidth;
  resultEl.classList.add("in");
}

function showError(e){
  console.error(e);
  emoEl.textContent = "🥲";
  nameEl.style.display = "none";
  chipEl.style.display = "none";
  tipEl.textContent = "";
  if(e && e.name === "NotAllowedError"){
    msgEl.textContent = "카메라 권한이 필요해요. 주소창 왼쪽 자물쇠 버튼에서 카메라를 허용하고 다시해 주세요.";
  } else {
    msgEl.textContent = "문제가 생겼어요. 인터넷 연결을 확인하고 다시해 주세요. (" + ((e && e.message) || e) + ")";
  }
  setState("error");
}

/* ---------- 표정 측정 (한 번 측정하면 결과를 고정) ---------- */
function loopFor(ms, onFrame){
  return new Promise((resolve) => {
    const t0 = performance.now();
    const tick = () => {
      const el = performance.now() - t0;
      if(el >= ms){ resolve(); return; }
      onFrame(el);
      requestAnimationFrame(tick);
    };
    tick();
  });
}

async function runRound(){
  resultEl.classList.remove("in");

  /* 3초 동안 표정을 측정하고, 가장 많이 나온 표정으로 결과를 고정 */
  setState("capture");
  barEl.style.transition = "none";
  barEl.style.width = "0%";
  void barEl.offsetWidth;
  barEl.style.transition = "width 3s linear";
  barEl.style.width = "100%";

  const votes = {laugh:0, happy:0, surprised:0, angry:0, sad:0, neutral:0};
  let total = 0;
  await loopFor(3000, () => {
    const s = readFace();
    if(s){ votes[classify(s)]++; total++; }
  });
  if(total < 5){ showResult("fail"); return; }
  showResult(decide(votes, total));
}

const run = () => { runRound().catch(showError); };

/* ---------- 시작 ---------- */
async function createLandmarker(){
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const model = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
  const make = (d) => FaceLandmarker.createFromOptions(fs, {
    baseOptions: {modelAssetPath: model, delegate: d},
    runningMode: "VIDEO",
    outputFaceBlendshapes: true,
    numFaces: 1
  });
  try{
    return await make("GPU");
  } catch(e){
    console.warn("GPU 실패, CPU로 재시도", e);
    return await make("CPU");
  }
}

async function startFlow(){
  setState("loading");
  const wxPromise = fetchWeather();   // 위치 허용 창과 카메라 허용 창을 같이 띄움
  try{
    if(!video.srcObject){
      video.srcObject = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}, audio:false});
      await video.play();
    }
    if(!landmarker) landmarker = await createLandmarker();
    wx = await wxPromise;
    await runRound();
  } catch(e){
    showError(e);
  }
}

startBtn.onclick = startFlow;
retryBtn.onclick = () => { if(landmarker && video.srcObject){ run(); } else { startFlow(); } };
</script>
</body>
